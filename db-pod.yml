apiVersion: v1
kind: Pod
metadata:
  name: postgres-db-app
  labels:
    app: postgres-db
spec:
  containers:
  -  image: postgres:15-alpine
     name: postgress-db
     env:
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        value: postgres
     ports: 
       - containerPort: 5432
              
